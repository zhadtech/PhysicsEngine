# Everyday gate (10 §6.1). Runs on every push/PR: typecheck, the verify suites
# these sessions built, and unit tests. The heavy cross-platform determinism +
# browser matrix lives in determinism-matrix.yml so this stays fast; a release
# is gated on both (types/infra.ts DEPLOY.gatedByCi).
#
# P0 made this real. Before the monorepo existed the jobs here were written
# against a layout that did not exist yet, and two of them could not have
# passed on a fresh clone:
#   * `verify-backend` ran `node verify-backend.mjs` at the repo root, but the
#     script read `./api.ts` — it only ever ran in a scratch dir with types/
#     flattened into it. Paths are repo-root anchored now (tools/repo.mjs).
#   * `typecheck` ran bare `tsc --strict` with no target, so it defaulted to
#     ES5/lib.es5 and failed on Array.includes and SharedArrayBuffer. Compiler
#     options now come from tsconfig.base.json.
# Everything below therefore runs the same commands a developer runs locally
# (`pnpm run ci`), which is the only way this gate stays honest.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Strict tsc over the design-phase type surface (types/*.ts) and every
  # workspace package, via turbo.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc (strict)
        run: pnpm run typecheck

  # The accumulated "verified, not just written" bar, turned into a merge gate.
  # One job per suite so a failure names itself in the checks list.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          # monorepo skeleton ↔ canonical layout ↔ 12-ROADMAP §3 ↔ SECRETS (P0)
          - workspace
          # ajv-strict scene-format corpus (schema, doc examples, 15 negatives)
          - scene
          # OpenAPI 3.1 + real PG grammar (pgsql-parser) + three-way error codes
          - backend
          # workflow structure, U9 matrix ↔ types/infra.ts, migrations, isolation
          - infra
          # U-issue/deliverable coverage + phase order is a valid topo sort
          - roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify ${{ matrix.suite }}
        run: pnpm run verify:${{ matrix.suite }}

  # Package unit tests across CI_NODE_VERSIONS (types/infra.ts). Real since P1:
  # `pnpm run test` is `turbo run test`, and the test task carries a self-edge on
  # `build`, so the packages are compiled before their suites run. That matters
  # for the '20' leg specifically — Node 20 cannot strip TypeScript, which is why
  # scene-format emits and its suites import from dist/ (D30).
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: unit tests
        run: pnpm run test
