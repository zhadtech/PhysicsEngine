# The U9 resolution (10 §6): the same golden hashes must match across ISAs and
# across the browser triple, or determinism — and therefore leaderboards (D17) —
# is not real. This is the standing CI proof that extends the single-machine
# spikes every session ran (S3/S6/S8/S9) into the cross-platform guarantee.
#
# Golden hashes are keyed by the engine build + verifier/ranking/perf versions
# (types/infra.ts CI.GOLDEN_KEY_VERSIONS); an unexplained mismatch is an engine
# incident, not an expected diff.
name: determinism-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly against the browser triple even when nothing changed (driver drift).
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  # Cross-ISA golden hash: headless SimCore (03 §1, environment-free core) run in
  # Node on x86-64 linux AND arm64 macOS must produce byte-identical state hashes.
  node-golden:
    strategy:
      fail-fast: false
      matrix:
        # DETERMINISM_RUNNERS in types/infra.ts — both ISAs are load-bearing for U9.
        os: [ubuntu-latest, macos-14]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run golden` builds packages/engine and replays the 03 §12 corpus,
      # comparing every 60th-step state hash — not just the final one — against
      # packages/engine/goldens/state.golden.json. Wired at P2b, when there was
      # finally an engine to run. Both ISAs and both Node lines execute the same
      # command a developer runs locally.
      - name: headless SimCore golden hashes (03 §12)
        run: pnpm run golden
      # The suites the golden run cannot see: the §12 properties that hold
      # *within* a process (double-run identity, snapshot equivalence, the DET-4
      # round trip, command-boundary independence) and the §7/§8 force-layer
      # units. A hash that reproduces everywhere while being wrong everywhere is
      # exactly what these catch.
      - name: engine unit suites (§12 properties, §7/§8 units)
        run: pnpm run test --filter=@physics/engine

  # Cross-browser golden hash + the 09 §9 render/perf gate. WASM + SAB transport
  # must agree with the Node build across Chromium/Firefox/WebKit (BROWSER_TRIPLE).
  browser-golden:
    strategy:
      fail-fast: false
      matrix:
        # BROWSER_TRIPLE in types/infra.ts.
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # P2c wires this leg: the same corpus and the same goldens, run through
      # worker.ts + the SAB transport in a real browser. The Node goldens above
      # are the numbers it must match.
      - name: install Playwright browsers
        run: echo "npx playwright install --with-deps ${{ matrix.browser }}"
      - name: browser SimCore golden hashes
        run: echo "same golden scenes in-browser; hash must equal the Node golden"
      - name: perf regression gate (09 §9)
        run: echo "per-tier frame p95 + draw-call ceiling vs committed PERF_VERSION baselines"
